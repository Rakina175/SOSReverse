name: Security Review

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Detect backend technology
        run: |
          chmod +x .github/scripts/detect-backend.sh || true
          .github/scripts/detect-backend.sh > detection.json || true
        shell: bash

      - name: Run npm audit
        run: |
          npm audit --json > npm-audit.json || true
        shell: bash

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: 'p/ci'
          output-format: json
          output-file: semgrep-results.json
        continue-on-error: true

      - name: Run Gitleaks
        uses: zricethezav/gitleaks-action@v2
        with:
          args: detect --report-format json --report-path gitleaks.json || true

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.7.0
        with:
          format: 'json'
          output: 'trivy-fs.json'
          scan-type: 'fs'
        continue-on-error: true

      - name: Generate security report
        run: |
          npm run security:report
          node scripts/copy-reports.cjs
        continue-on-error: true

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-artifacts
          path: |
            detection.json
            npm-audit.json
            semgrep-results.json
            gitleaks.json
            trivy-fs.json
            "Vulnerability Test Results/**"
            security-review.md
            executive-summary.md
            dependency-report.md

      - name: Fail on critical findings
        run: |
          node .github/scripts/fail-on-critical.cjs detection.json semgrep-results.json npm-audit.json gitleaks.json trivy-fs.json || exit 1
        shell: bash
