name: SOSReverse Test Automation

on:
  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  selenium:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Run Selenium Tests
        run: npm run selenium:test

      - name: Generate Excel Report
        run: npm run selenium:report

      - name: Upload Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Report
          path: |
            selenium-tests/**/*.xlsx
            selenium-tests/**/*.json
