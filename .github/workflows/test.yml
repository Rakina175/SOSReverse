- name: Install wait-on
  run: npm install --no-save wait-on

- name: Start Vite Server
  run: |
    nohup npm run dev -- --host 0.0.0.0 --port 5173 > vite.log 2>&1 &
  shell: bash

- name: Wait for Vite Server
  run: |
    timeout 90 bash -c 'until curl -f http://127.0.0.1:5173; do sleep 2; done'
  shell: bash

- name: Show Vite Log
  if: always()
  run: cat vite.log