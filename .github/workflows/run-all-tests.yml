name: Run All Tests and Collect Reports

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Start preview server in background
        run: |
          nohup npm run preview -- --port 5173 > preview.log 2>&1 &
          npx wait-on http://localhost:5173 -t 30000
        shell: bash

      - name: Run Selenium tests
        run: |
          echo "Running Selenium E2E tests"
          node selenium-tests/tests/login-tests.js
        shell: bash
        continue-on-error: true

      - name: Run Selenium report generator
        run: |
          if [ -f selenium-tests/generate-report.cjs ]; then
            node selenium-tests/generate-report.cjs
          fi
        shell: bash
        continue-on-error: true

      - name: Run Appium tests
        run: |
          echo "Running Appium E2E tests"
          npm run appium:test
        shell: bash
        continue-on-error: true

      - name: Run Appium report generator
        run: |
          if [ -f appium-tests/generate-report.cjs ]; then
            node appium-tests/generate-report.cjs
          fi
        shell: bash
        continue-on-error: true

      - name: Run Load test (100 users x 1 minute)
        run: |
          echo "Running load test"
          node load-tests/100-users-1min-load-test.mjs
        shell: bash
        continue-on-error: true

      - name: Upload Excel report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-excel-reports
          path: |
            **/reports/*.xlsx
            **/*-report*.xlsx
            selenium-tests/reports/*.xlsx
            appium-tests/reports/*.xlsx
            load-tests/reports/*.xlsx
