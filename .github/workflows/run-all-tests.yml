name: Run All 4 Tests and Collect Reports

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  run-all-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Start Vite Server
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5173 > vite.log 2>&1 &
        shell: bash

      - name: Wait for Vite Server
        run: |
          npx wait-on http://127.0.0.1:5173 --timeout 120000
        shell: bash

      - name: Run Selenium Web E2E Login Tests
        run: npm run selenium:test
        shell: bash
        continue-on-error: true

      - name: Run Appium Mobile E2E Login Tests (Dry Run)
        run: npm run appium:test:dry
        shell: bash
        continue-on-error: true

      - name: Run Baseline Load Tests
        run: npm run load:test:baseline
        shell: bash
        continue-on-error: true

      - name: Run npm audit scan
        run: |
          npm audit --json > npm-audit.json || true
        shell: bash

      - name: Create SAST/Secrets Scan Placeholders
        run: |
          echo '{}' > semgrep-results.json
          echo '{}' > gitleaks.json
          echo '{}' > trivy-fs.json
        shell: bash

      - name: Run Security Report Generator
        run: npm run security:report
        shell: bash
        continue-on-error: true

      - name: Consolidate and Copy Excel Reports
        if: always()
        run: node scripts/copy-reports.cjs
        shell: bash

      - name: Upload Excel report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-test-excel-reports
          path: |
            reports/*.xlsx
            Vulnerability Test Results/findings.xlsx
            Vulnerability Test Results/endpoint-inventory.xlsx
            security-review.md
            executive-summary.md
            dependency-report.md

